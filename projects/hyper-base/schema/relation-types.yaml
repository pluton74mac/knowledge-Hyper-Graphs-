# Relation types for the EEG example. v0, 2026-09-21.
#
# Fields per relation type:
#   roles:  name -> {required: bool, kind: entity|value|source|hyperedge, unit: <optional>}
#   key:    the roles that identify the thing the fact is about. Two accepted hyperedges of the same
#           relation with equal key bindings and different non-key bindings are a conflict.
#   temporal: whether valid_from / valid_to apply (default false).
#   owner_disciplines: advisory, which briefs are expected to produce the relation.
#
# The schema is edited by hand or through the review queue, never by a research agent.

version: 0.1

relation_types:

  # ---- goal-level relations (the device) ----------------------------------------------------

  measures:
    roles:
      device:          {required: true,  kind: entity}
      signal:          {required: true,  kind: entity}
      band:            {required: true,  kind: entity}
      amplitude_range: {required: true,  kind: value, unit: V}
      sensor:          {required: true,  kind: entity}
    key: [device, signal, band]
    owner_disciplines: [medicine, integrator]

  acquires:
    roles:
      device:      {required: true, kind: entity}
      sensor:      {required: true, kind: entity}
      front_end:   {required: true, kind: entity}
      sample_rate: {required: true, kind: value, unit: Hz}
      resolution:  {required: true, kind: value, unit: bit}
    key: [device, sensor]
    owner_disciplines: [electronics, integrator]

  rejects:
    roles:
      device:               {required: true, kind: entity}
      interference:         {required: true, kind: entity}
      mechanism:            {required: true, kind: entity}
      required_attenuation: {required: true, kind: value, unit: dB}
    key: [device, interference]
    owner_disciplines: [physics, electronics, integrator]

  safe_for:
    roles:
      device:        {required: true, kind: entity}
      population:    {required: true, kind: entity}
      standard:      {required: true, kind: entity}
      leakage_limit: {required: true, kind: value, unit: A}
    key: [device, population, standard]
    owner_disciplines: [electronics, medicine]

  places:
    roles:
      device:           {required: true, kind: entity}
      electrode_scheme: {required: true, kind: entity}
      channel_count:    {required: true, kind: value, unit: count}
    key: [device, electrode_scheme]
    owner_disciplines: [medicine]

  # ---- domain relations (single discipline) -------------------------------------------------

  originates_from:
    # a signal arises from a physiological generator
    roles:
      signal:     {required: true,  kind: entity}
      generator:  {required: true,  kind: entity}
      not_from:   {required: false, kind: entity}
    key: [signal]
    owner_disciplines: [medicine]

  has_amplitude:
    roles:
      signal:     {required: true, kind: entity}
      location:   {required: true, kind: entity}
      range:      {required: true, kind: value, unit: V}
      population: {required: false, kind: entity}
    key: [signal, location, population]
    owner_disciplines: [medicine]

  band_definition:
    roles:
      band:       {required: true, kind: entity}
      low:        {required: true, kind: value, unit: Hz}
      high:       {required: true, kind: value, unit: Hz}
      convention: {required: false, kind: source}
    key: [band, convention]
    owner_disciplines: [medicine]

  conductivity:
    roles:
      tissue: {required: true, kind: entity}
      value:  {required: true, kind: value, unit: S/m}
      method: {required: false, kind: entity}
    key: [tissue, method]
    owner_disciplines: [physiology, physics]

  electrode_impedance:
    roles:
      electrode_type: {required: true, kind: entity}
      skin_prep:      {required: true, kind: entity}
      value:          {required: true, kind: value, unit: ohm}
      frequency:      {required: false, kind: value, unit: Hz}
    key: [electrode_type, skin_prep, frequency]
    owner_disciplines: [physiology, electronics]

  artifact_source:
    roles:
      artifact:     {required: true,  kind: entity}
      origin:       {required: true,  kind: entity}
      band_overlap: {required: false, kind: entity}
    key: [artifact]
    owner_disciplines: [physiology, medicine]

  component_spec:
    roles:
      component: {required: true, kind: entity}
      parameter: {required: true, kind: entity}
      value:     {required: true, kind: value}
      condition: {required: false, kind: entity}
    key: [component, parameter, condition]
    owner_disciplines: [electronics]

  standard_limit:
    roles:
      standard:  {required: true, kind: entity}
      quantity:  {required: true, kind: entity}
      limit:     {required: true, kind: value}
      condition: {required: false, kind: entity}
    key: [standard, quantity, condition]
    temporal: true          # standards get revised; valid-time applies
    owner_disciplines: [electronics]

  # ---- cross-discipline relations -----------------------------------------------------------

  snr_constraint:
    roles:
      signal_amplitude: {required: true, kind: value, unit: V}
      amplifier_noise:  {required: true, kind: value, unit: V}
      required_ratio:   {required: true, kind: value, unit: dB}
    key: [signal_amplitude, amplifier_noise]
    owner_disciplines: [integrator]

  sample_rate_rule:
    roles:
      band_of_interest: {required: true, kind: entity}
      rule:             {required: true, kind: entity}
      minimum_rate:     {required: true, kind: value, unit: Hz}
      margin_rate:      {required: false, kind: value, unit: Hz}
      use_case:         {required: false, kind: entity}   # added in round 2 of the worked conflict
    key: [band_of_interest, use_case]
    owner_disciplines: [physics, medicine, integrator]

  interference_path:
    roles:
      source:          {required: true, kind: entity}
      coupling:        {required: true, kind: entity}
      countermeasure:  {required: true, kind: entity}
      residual_target: {required: false, kind: value, unit: V}
    key: [source, coupling]
    owner_disciplines: [physics, electronics, integrator]

  impedance_budget:
    roles:
      skin_prep:              {required: true, kind: entity}
      electrode_impedance:    {required: true, kind: value, unit: ohm}
      input_impedance_needed: {required: true, kind: value, unit: ohm}
      ratio_rule:             {required: false, kind: entity}
    key: [skin_prep]
    owner_disciplines: [physiology, electronics, integrator]

  # ---- meta relations (hyperedges about hyperedges) -----------------------------------------

  supports:
    roles:
      claim:    {required: true, kind: hyperedge}
      basis:    {required: true, kind: hyperedge}
    key: [claim, basis]

  contradicts:
    roles:
      a: {required: true, kind: hyperedge}
      b: {required: true, kind: hyperedge}
    key: [a, b]

  derived_from:
    # a cross-discipline fact derived from single-discipline facts
    roles:
      derived: {required: true, kind: hyperedge}
      from:    {required: true, kind: hyperedge}
    key: [derived, from]
