[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "khg-width"
dynamic = ["version"]
description = "Acyclicity class (Berge, gamma, beta, alpha, cyclic) and hypertree width (hw, ghw, fhw, tw) of khg-relation-schema/1.0.0 files, with witnesses and validated decompositions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pluton74mac" }]
keywords = ["hypergraph", "acyclicity", "hypertree width", "tree decomposition", "knowledge hypergraph", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["khg-contracts>=1.0.0.dev0,<2"]

[project.optional-dependencies]
fast = ["scipy>=1.10"]
survey = ["linkml-runtime==1.11.1", "pyyaml", "matplotlib"]
dev = ["pytest>=8"]

[project.scripts]
khg-width = "khg_width.cli:main"

[project.urls]
Repository = "https://github.com/pluton74mac/knowledge-Hyper-Graphs-"
Design = "https://github.com/pluton74mac/knowledge-Hyper-Graphs-/blob/main/projects/p6-schema-width/DESIGN.md"

[tool.hatch.version]
path = "src/khg_width/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/khg_width"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "solvers: needs the BalancedGo and log-k-decomp binaries (skips without them; scripts/build-solvers.sh)",
    "survey: needs the survey results (skips until projects/p6-schema-width/results/survey.csv exists)",
    "slow: takes more than a few seconds",
]
