[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "khg-bakeoff"
dynamic = ["version"]
description = "P1's store adapters: the C2 store interface khg-store/1.0.0 on SQLite, PostgreSQL, Oxigraph, Neo4j, TypeDB and HIF files, with the conformance and fidelity runs of the format and store bake-off."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pluton74mac" }]
keywords = ["hypergraph", "knowledge hypergraph", "benchmark", "PostgreSQL", "RDF", "Neo4j", "TypeDB", "HIF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = ["khg-contracts>=1.0.0.dev0,<2"]

# The client versions research 01 probed (P1 README, rulings on research 01).
[project.optional-dependencies]
oxigraph = ["pyoxigraph==0.5.11"]
postgres = ["psycopg[binary]==3.3.6"]
neo4j = ["neo4j==6.3.1"]
typedb = ["typedb-driver==3.13.6"]
all = ["pyoxigraph==0.5.11", "psycopg[binary]==3.3.6", "neo4j==6.3.1", "typedb-driver==3.13.6"]
dev = ["pytest>=8"]

[project.scripts]
khg-bakeoff = "khg_bakeoff.cli:main"

[project.urls]
Repository = "https://github.com/pluton74mac/knowledge-Hyper-Graphs-"
Design = "https://github.com/pluton74mac/knowledge-Hyper-Graphs-/blob/main/projects/p1-store-bakeoff/DESIGN.md"

[tool.hatch.version]
path = "src/khg_bakeoff/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/khg_bakeoff"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "server: needs a running server named by an environment variable (skips without it)",
    "slow: takes more than a few seconds",
]
